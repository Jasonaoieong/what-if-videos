function face(kind){return tex(256,256,(g)=>{g.fillStyle='#111';g.strokeStyle='#111';g.lineCap='round';g.lineWidth=11;
  const dot=(x,y,rx=12,ry=22)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();};

  const openMouth=(y=150,w=54)=>{g.beginPath();g.moveTo(128-w,y);g.quadraticCurveTo(128,y+w*1.9,128+w,y);g.closePath();g.fill();g.fillStyle='#e8344a';g.beginPath();g.ellipse(128,y+w*.85,w*.45,w*.28,0,0,7);g.fill();g.fillStyle='#111';};

  if(kind==='grin'){dot(96,96);dot(160,96);openMouth(146,50);}
  if(kind==='happy'){arcEye(96,100);arcEye(160,100);openMouth(146,52);}
  if(kind==='wink'){dot(96,98);g.beginPath();g.moveTo(144,104);g.lineTo(176,92);g.moveTo(144,104);g.lineTo(176,114);g.stroke();openMouth(148,46);}
  if(kind==='sad'){dot(96,108,11,18);dot(160,108,11,18);g.lineWidth=9;g.beginPath();g.moveTo(74,88);g.lineTo(112,78);g.moveTo(144,78);g.lineTo(182,88);g.stroke();g.lineWidth=10;g.beginPath();g.arc(128,196,34,1.15*Math.PI,1.85*Math.PI);g.stroke();}
  if(kind==='shock'){g.fillStyle='#fff';g.beginPath();g.arc(96,96,26,0,7);g.arc(160,96,26,0,7);g.fill();g.lineWidth=7;g.beginPath();g.arc(96,96,26,0,7);g.stroke();g.beginPath();g.arc(160,96,26,0,7);g.stroke();
    g.fillStyle='#111';g.beginPath();g.arc(96,98,10,0,7);g.arc(160,98,10,0,7);g.fill();g.beginPath();g.ellipse(128,178,22,30,0,0,7);g.fill();g.fillStyle='#e8344a';g.beginPath();g.ellipse(128,190,12,10,0,0,7);g.fill();}
  if(kind==='blush'){dot(96,100);dot(160,100);g.beginPath();g.arc(128,135,40,.22*Math.PI,.78*Math.PI);g.stroke();g.fillStyle='rgba(255,90,120,.55)';g.beginPath();g.ellipse(70,150,20,11,0,0,7);g.ellipse(186,150,20,11,0,0,7);g.fill();}
  if(kind==='love'){const hrt=(x,y)=>{g.fillStyle='#ff3d6e';g.beginPath();g.moveTo(x,y+16);g.bezierCurveTo(x-30,y-6,x-14,y-26,x,y-10);g.bezierCurveTo(x+14,y-26,x+30,y-6,x,y+16);g.fill();};hrt(96,100);hrt(160,100);g.fillStyle='#111';openMouth(150,44);}
  if(kind==='meh'){dot(96,104,11,16);dot(160,104,11,16);g.beginPath();g.moveTo(104,170);g.lineTo(152,170);g.stroke();}
});}

function captions(t,shot,k,sc){cap.className='';let txt='';

  cap.textContent=txt;}
