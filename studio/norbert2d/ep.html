<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
html, body { margin: 0; background: #000; overflow: hidden; }
svg { display: block; }
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="whip" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur id="whipb" stdDeviation="0 0"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="freeze"><feColorMatrix type="saturate" values="0.15"/></filter>
    <clipPath id="mirrorclip"><ellipse cx="540" cy="900" rx="330" ry="430"/></clipPath>
  </defs>
  <g id="world"></g>
  <g id="ui"></g>
</svg>
<script src="norbert.js"></script>
<script src="lib.js"></script>
<script src="dentist.js"></script>
<script>
// Episode renderer. window.EP is injected by render.js; window.frame(t) draws one frame.
const N = window.Norbert;
const { ease, easeIO, pop, between } = L;
const HEAD = { x: 540, y: 1290 - 0.92 * 490 };      // Norbert's head in room coordinates
const NOSE = { x: 540 + 0.92 * 24, y: 1290 - 0.92 * 452 };
const TEETH = { x: 540, y: 1290 - 0.92 * 385 };

function cam(cx, cy, z) { return `translate(540 960) scale(${z.toFixed(4)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`; }
function lerp(a, b, k) { return a + (b - a) * k; }

function mouthAt(t, who = 'NORB') {
  const m = Array.isArray(EP.mouth) ? EP.mouth : (EP.mouth[who] || []), i = Math.floor(t * EP.fps);
  return i >= 0 && i < m.length ? m[i] : 0;
}
function blinkAt(t) {
  const ph = (t + 0.7) % 3.3;
  return Math.max(0, 1 - Math.abs(ph - 3.1) / 0.07);
}
function sceneAt(t) {
  const ls = EP.lines;
  for (let i = ls.length - 1; i >= 0; i--) if (t >= (i === 0 ? 0 : ls[i].t0 - 0.12)) return { i, line: ls[i], t0: i === 0 ? 0 : ls[i].t0 - 0.12, t1: i + 1 < ls.length ? ls[i + 1].t0 - 0.12 : EP.dur };
  return { i: 0, line: ls[0], t0: 0, t1: ls[0].t1 };
}

function norbert(p, t) {
  return N.svg(Object.assign({ x: 540, y: 1290, scale: 0.92, t, blink: blinkAt(t), talk: mouthAt(t) }, EP.look || {}, p));
}

function roomShot(t, p, camv, extra = '') {
  return `<g transform="${cam(...camv)}"><g transform="translate(0 150)">${L.room(t)}</g>` +
    L.stink(t, 540, 1150) + norbert(p, t) + extra + `</g>`;
}

const SCENES = {
  wide(t, k, tl) {
    const z = lerp(1.08, 1.0, ease(tl / 0.6));
    const p = { expr: 'awkward', armR: 2.6 + Math.sin(t * 13) * 0.25, bendR: -0.5, headTilt: -4, look: { x: 0.2, y: 0 } };
    return roomShot(t, p, [540, 1020, z], L.flies(t, 560, 760));
  },
  face(t, k, tl) {
    const z = lerp(2.05, 2.3, k);
    // a fly drifts in and lands on his nose
    const land = ease((k - 0.2) / 0.5);
    const fx = lerp(820, NOSE.x + 6, land) + (land < 1 ? Math.sin(t * 9) * 30 : 0);
    const fy = lerp(640, NOSE.y - 30, land) + (land < 1 ? Math.cos(t * 7) * 20 : 0);
    const look = land < 1 ? { x: (fx - HEAD.x) / 200, y: (fy - HEAD.y) / 300 } : { x: 0.1, y: 0.7 };
    const p = { expr: k > 0.7 ? 'awkward' : 'neutral', look };
    return roomShot(t, p, [540, 860, z], L.fly(fx, fy, t));
  },
  teeth(t, k, tl) {
    const z = lerp(3.0, 3.5, easeIO(k));
    const p = { expr: 'smug', look: { x: 0, y: 0 }, talk: 0 };
    let sp = '';
    const g = pop(t, sceneAt(t).t0 + 0.6, 0.25);
    if (g) {
      sp += L.sparkle(TEETH.x - 30, TEETH.y + 6, 26 * g, t * 90);
      sp += L.sparkle(TEETH.x + 22, TEETH.y - 4, 18 * g, -t * 120);
    }
    return roomShot(t, p, [540, TEETH.y, z], sp);
  },
  phone_pull(t, k, tl) {
    const up = ease(tl / 0.35);
    const p = { expr: 'neutral', armR: lerp(0.26, 2.05, up), bendR: lerp(-0.25, 0.75, up), phone: true, phoneGlow: true,
      look: { x: 0.6, y: -0.2 }, headTilt: 5 };
    const vib = tl < 0.6 ? Math.sin(t * 90) * 4 : 0;
    return roomShot(t, Object.assign(p, { x: 540 + vib }), [560, 980, 1.35]);
  },
  flyer(t, k, tl) {
    const bg = roomShot(t, { expr: 'neutral', phone: true, phoneGlow: true, armR: 2.05, bendR: 0.75 }, [560, 980, 1.35]);
    const pk = pop(t, sceneAt(t).t0, 0.3);
    const y = lerp(1300, 980, ease(tl / 0.3));
    let ph = `<g transform="translate(540 ${y.toFixed(1)}) rotate(${(Math.sin(t * 2) * 1.5).toFixed(2)})">` +
      `<rect x="-330" y="-600" width="660" height="1200" rx="70" fill="#14141C" stroke="#000" stroke-width="10"/>` +
      `<rect x="-298" y="-560" width="596" height="1120" rx="44" fill="#5B2A86"/>` +
      `<circle cx="0" cy="-260" r="150" fill="#C9D6F2" stroke="#000" stroke-width="8"/>`;
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
      const a = (i / 6) * Math.PI * 2 + t * 0.8, r = 30 + j * 20;
      ph += `<rect x="${(Math.cos(a + j) * r - 9).toFixed(1)}" y="${(-260 + Math.sin(a + j) * r - 9).toFixed(1)}" width="18" height="18" fill="${(i + j) % 2 ? '#FFFFFF' : '#8FA6D6'}"/>`;
    }
    ph += `<line x1="0" y1="-560" x2="0" y2="-410" stroke="#000" stroke-width="6"/>`;
    ph += `<text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="130" fill="#FFD23F" stroke="#000" stroke-width="10" paint-order="stroke">SPRING</text>`;
    ph += `<text x="0" y="140" text-anchor="middle" font-family="Anton" font-size="130" fill="#FF7AC6" stroke="#000" stroke-width="10" paint-order="stroke">DANCE</text>`;
    ph += `<rect x="-220" y="210" width="440" height="110" rx="24" fill="#FFFFFF" stroke="#000" stroke-width="7"/>`;
    ph += `<text x="0" y="292" text-anchor="middle" font-family="Anton" font-size="78" fill="#5B2A86">IN 30 DAYS</text>`;
    for (let i = 0; i < 14; i++) ph += `<circle cx="${(-260 + (i * 97) % 520).toFixed(0)}" cy="${(380 + (i * 53) % 150).toFixed(0)}" r="6" fill="${['#FFD23F', '#FF7AC6', '#7FE3FF'][i % 3]}" opacity="${(0.5 + 0.5 * Math.sin(t * 6 + i)).toFixed(2)}"/>`;
    ph += `</g>`;
    return `<g filter="url(#soft)" opacity="0.75">${bg}</g><rect width="1080" height="1920" fill="rgba(10,8,20,0.45)"/>` + (pk ? ph : '');
  },
  maya(t, k, tl) {
    const sh = k < 0.35 ? Math.sin(t * 50) * 6 : 0;
    const p = { expr: k < 0.45 ? 'shocked' : 'panic', phone: true, phoneGlow: true, armR: 2.05, bendR: 0.75,
      armL: k < 0.45 ? 0.3 : 2.5 + Math.sin(t * 16) * 0.15, bendL: 0.5, look: { x: 0, y: 0 }, squash: Math.max(0, 1 - tl / 0.2) };
    let bubble = '';
    const bk = pop(t, sceneAt(t).t0 + (sceneAt(t).t1 - sceneAt(t).t0) * 0.42, 0.25);
    if (bk) {
      bubble = `<g transform="translate(560 640) scale(${bk.toFixed(3)})">` +
        `<rect x="-420" y="-120" width="840" height="240" rx="40" fill="#FFFFFF" stroke="#000" stroke-width="8"/>` +
        `<circle cx="-330" cy="0" r="62" fill="#C77DFF" stroke="#000" stroke-width="6"/>` +
        `<text x="-330" y="26" text-anchor="middle" font-family="Anton" font-size="70" fill="#fff">M</text>` +
        `<text x="-240" y="-30" font-family="Anton" font-size="52" fill="#5B2A86">MAYA 💛</text>` +
        `<text x="-240" y="56" font-family="Anton" font-size="60" fill="#1A1410">r u going to the dance? 👀</text></g>`;
    }
    return `<g transform="translate(${sh.toFixed(1)} 0)">` + roomShot(t, p, [540, 930, 1.55], L.flies(t, 560, 760, 2)) + `</g>` + bubble;
  },
  determined(t, k, tl) {
    const nod = Math.sin(tl * 9) * (tl < 0.8 ? 6 : 0);
    const p = { expr: 'determined', armL: 2.0, bendL: -0.9, armR: 2.0, bendR: -0.9, headTilt: nod, look: { x: 0, y: 0 } };
    return roomShot(t, p, [540, 1000, lerp(1.1, 1.22, k)], L.flies(t, 560, 760, 2));
  },
  mirror(t, k, tl) {
    const freeze = tl > 0.55;
    const tt = freeze ? sceneAt(t).t0 + 0.55 : t;
    let s = `<rect width="1080" height="1920" fill="#BFD7DA"/>`;
    for (let y = 0; y < 1920; y += 120) for (let x = (y / 120) % 2 ? -60 : 0; x < 1080; x += 120)
      s += `<rect x="${x + 4}" y="${y + 4}" width="112" height="112" fill="#D7EAEC" stroke="#9DB9BC" stroke-width="4"/>`;
    s += `<ellipse cx="540" cy="900" rx="350" ry="450" fill="#C9A227" stroke="#1A1410" stroke-width="10"/>`;
    s += `<ellipse cx="540" cy="900" rx="330" ry="430" fill="#DDEFF5"/>`;
    s += `<g clip-path="url(#mirrorclip)"><g transform="translate(540 900) scale(-1 1) translate(-540 -900)">` +
      N.svg({ x: 540, y: 900 + 490 * 1.55, scale: 1.55, t: tt, expr: 'shocked', blink: 0, talk: 0, look: { x: 0, y: 0 } }) +
      L.fly(640 + Math.sin(tt * 8) * 60, 560 + Math.cos(tt * 6) * 30, tt) + `</g>`;
    const crack = ease((tl - 0.45) / 0.12);
    if (crack > 0) s += `<path d="M 380 560 L 470 690 L 430 760 L 560 900 L 520 980 L 650 1120" fill="none" stroke="#FFFFFF" stroke-width="${(10 * crack).toFixed(1)}" stroke-linejoin="round"/>` +
      `<path d="M 560 900 L 700 860 L 760 920" fill="none" stroke="#FFFFFF" stroke-width="${(7 * crack).toFixed(1)}"/>`;
    s += `<path d="M 300 640 Q 360 560 430 540" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/></g>`;
    s += `<rect x="380" y="1380" width="320" height="60" rx="20" fill="#EEE" stroke="#1A1410" stroke-width="7"/>`;
    return freeze ? `<g filter="url(#freeze)">${s}</g>` : s;
  },
  meter(t, k, tl) {
    let s = L.sunburst(t, '#1E78D2', '#2A8BE6');
    const fill = 0;
    s += `<g transform="translate(540 760) scale(${pop(t, sceneAt(t).t0 + 0.1, 0.3).toFixed(3)})">`;
    s += `<text x="0" y="-120" text-anchor="middle" font-family="Anton" font-size="110" fill="#FFFFFF" stroke="#000" stroke-width="14" paint-order="stroke">GLOW-UP METER</text>`;
    s += `<rect x="-420" y="-40" width="840" height="110" rx="55" fill="#141B2D" stroke="#000" stroke-width="10"/>`;
    s += `<rect x="-405" y="-25" width="80" height="80" rx="40" fill="#5BE37D"/>`;
    s += `<text x="0" y="330" text-anchor="middle" font-family="Anton" font-size="300" fill="#FFD23F" stroke="#000" stroke-width="22" paint-order="stroke">${fill}%</text>`;
    s += `</g>`;
    const ck = pop(t, sceneAt(t).t0 + (sceneAt(t).t1 - sceneAt(t).t0) * 0.55, 0.25);
    if (ck) s += `<g transform="translate(540 1230) scale(${ck.toFixed(3)})"><rect x="-380" y="-64" width="760" height="128" rx="30" fill="#5BE37D" stroke="#000" stroke-width="8"/>` +
      `<text x="0" y="30" text-anchor="middle" font-family="Anton" font-size="76" fill="#0B2A14">EVERY FIX STAYS FOREVER</text></g>`;
    s += N.svg({ x: 540, y: 1860, scale: 0.46, t, expr: 'sad', blink: blinkAt(t), talk: 0, look: { x: 0, y: -0.5 } });
    return s;
  },
  plead(t, k, tl) {
    const p = { expr: 'plead', armL: 1.7, bendL: -1.1, armR: 1.7, bendR: -1.1, headTilt: Math.sin(t * 3) * 3, look: { x: 0, y: -0.3 } };
    return roomShot(t, p, [540, 900, lerp(1.6, 1.8, k)], L.flies(t, 560, 760, 3));
  },
  vote(t, k, tl) {
    let s = L.sunburst(t, '#6A2FB8', '#7B3FD0');
    const t0 = sceneAt(t).t0;
    s += L.banner(t, 'WHAT SHOULD NORBERT FIX FIRST?', t0, 470, 62);
    const opts = [['💇', EP.vote[0]], ['🦷', EP.vote[1]], ['✨', EP.vote[2]], ['🛏️', EP.vote[3]]];
    const hi = Math.floor(tl / 0.6) % 4;
    opts.forEach(([e, w], i) => {
      s += L.chip(t, t0 + 0.25 + i * 0.22, 540, 680 + i * 215, 640, e, w, tl > 1.2 && i === hi);
    });
    s += N.svg({ x: 540 + Math.sin(t * 2) * 10, y: 1900, scale: 0.48, t, expr: 'happy', armL: 2.7, armR: 2.7, bendL: 0.3, bendR: 0.3, blink: blinkAt(t), talk: 0 });
    return s;
  },
};

window.frame = function (t) {
  const sc = sceneAt(t), tl = t - sc.t0, k = Math.min(1, tl / Math.max(0.01, sc.t1 - sc.t0));
  let world = SCENES[sc.line.scene](t, k, tl);
  // whip transition on every cut
  const w = 1 - ease(tl / 0.22);
  const blur = document.getElementById('whipb');
  if (sc.i > 0 && w > 0.02) {
    blur.setAttribute('stdDeviation', `${(w * 40).toFixed(1)} 0`);
    world = `<g filter="url(#whip)" transform="translate(${(w * 160).toFixed(1)} 0)">${world}</g>`;
  }
  document.getElementById('world').innerHTML = world;

  let ui = '';
  const scn = sc.line.scene;
  if (!(EP.nohud || ['flyer', 'mirror']).includes(scn)) ui += L.hud(EP.days_left, typeof glowAt === 'function' ? glowAt(t) : EP.glow);
  if (scn === 'wide' || scn === 'determined' || scn === 'plead') ui += L.banner(t, '30 DAYS TO THE SPRING DANCE', scn === 'wide' ? 0.15 : sc.t0 + 0.05);
  // word-by-word captions
  const cy = scn === 'vote' ? 1590 : scn === 'meter' ? 1440 : scn === 'flyer' ? 1760 : 1420;
  for (const c of EP.caps) if (between(t, c.t0, c.t1)) ui += L.caption(t, c.text, c.t0, cy, c.text.length > 14 ? 110 : 132, (EP.capColors || { NORB: '#FFD23F' })[c.who] || '#FFFFFF');
  if (scn === 'mirror' && tl > 0.55) ui += `<text x="540" y="300" text-anchor="middle" font-family="Anton" font-size="90" fill="#FFFFFF" stroke="#000" stroke-width="14" paint-order="stroke">*RECORD SCRATCH*</text>`;
  if (scn === 'vote' && tl > 1.6) {
    const b = 1 + Math.sin(t * 7) * 0.05;
    ui += `<g transform="translate(540 1790) scale(${b.toFixed(3)})"><text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="78" fill="#FFD23F" stroke="#000" stroke-width="14" paint-order="stroke">COMMENT ONE WORD 👇</text></g>`;
  }
  document.getElementById('ui').innerHTML = ui;
};
window.EP = window.EP || { lines: [{ scene: 'wide', t0: 0, t1: 3 }], caps: [], mouth: [], fps: 30, dur: 3, days_left: 30, glow: 0, vote: ['A', 'B', 'C', 'D'] };
</script>
<script src="scenes_ep02.js"></script>
</body></html>
