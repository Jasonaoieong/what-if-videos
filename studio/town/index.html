<script type="module">
import * as THREE from './three.module.min.js';
const W=1080,H=1920;
const TL = await (await fetch('timeline.json')).json();
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,W/H,0.1,900);

// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const vl=(a,b,k)=>a.clone().lerp(b,k);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const studTex=(col,rep)=>canvasTex(64,64,(g,w,h)=>{g.fillStyle=col;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.arc(34,35,17,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.22)';g.beginPath();g.arc(31,30,16,0,7);g.fill();
  g.fillStyle=col;g.beginPath();g.arc(32,32,14,0,7);g.fill();
  g.strokeStyle='rgba(0,0,0,.08)';g.strokeRect(0,0,w,h);},rep);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0},o));
function box(w,h,d,mat,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m;}

// ---------- sky + light ----------
const skyU={top:{value:new THREE.Color('#3E8EEA')},bot:{value:new THREE.Color('#BFE6FF')}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(600,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyU,
  vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top,bot;varying vec3 p;void main(){float h=clamp(normalize(p).y*1.6+.1,0.,1.);gl_FragColor=vec4(mix(bot,top,h),1.);}'}));
scene.add(sky);
const hemi=new THREE.HemisphereLight('#dff1ff','#5a7a3a',1.3);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff3dd',2.6);sun.position.set(30,60,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:200});sun.shadow.bias=-0.0005;
scene.add(sun);scene.add(sun.target);
scene.fog=new THREE.Fog('#BFE6FF',60,220);
const boomLight=new THREE.PointLight('#ffaa33',0,80);scene.add(boomLight);

// ---------- town ----------
const ground=new THREE.Mesh(new THREE.BoxGeometry(400,2,400),M('#4CB04C',{map:studTex('#4CB04C',[200,200])}));
ground.position.y=-1;ground.receiveShadow=true;scene.add(ground);
const roadMat=M('#4a4d52',{map:studTex('#4a4d52',[8,200])});
const roadA=box(8,.1,400,roadMat,0,.05,-10);roadA.castShadow=false;
const roadB=box(400,.1,8,M('#4a4d52',{map:studTex('#4a4d52',[200,4])}),0,.05,-10);roadB.castShadow=false;
const sideMat=M('#c9c9c9',{map:studTex('#c9c9c9',[30,30])});
const plaza=box(22,.2,18,sideMat,0,.1,2);plaza.castShadow=false;
for(let i=-6;i<=6;i++){box(.6,.02,2.2,M('#f2f2f2'),0,.11,-10+i*5).castShadow=false;}
const winTex=(base)=>canvasTex(128,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=14;y<h-30;y+=40)for(let x=12;x<w-10;x+=38){g.fillStyle='#253a52';g.fillRect(x,y,26,26);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+2,y+2,8,22);}
  g.fillStyle='#5b3a1e';g.fillRect(w/2-14,h-34,28,34);});
const BCOL=['#E85D5D','#F2A93B','#5C8DE8','#F2F2F2','#8E6BD8','#3FBFA8','#F27FB0','#D9C27A'];
const buildings=[];
[[-18,6],[-18,18],[18,8],[18,20],[-30,-22],[-14,-24],[14,-26],[30,-22],[-34,10],[34,4],[0,26],[-8,30],[10,32]].forEach(([x,z],i)=>{
  const h=8+rnd(i)*14,w=8+rnd(i+9)*4;const col=BCOL[i%BCOL.length];
  const mats=[M(col,{map:winTex(col)})];mats[0].map.repeat.set(Math.round(w/4),Math.round(h/8));mats[0].map.wrapS=mats[0].map.wrapT=THREE.RepeatWrapping;
  const b=box(w,h,w,mats[0],x,h/2,z);box(w+.6,.8,w+.6,M('#6b6b6b'),x,h+.4,z);buildings.push(b);});
function tree(x,z,s=1){box(.8*s,3*s,.8*s,M('#7a4a26'),x,1.5*s,z);box(3.4*s,2.4*s,3.4*s,M('#2f9e3c',{map:studTex('#2f9e3c',[3,2])}),x,3.8*s,z);box(2.2*s,1.4*s,2.2*s,M('#3dbb4b'),x,5.5*s,z);}
[[-9,-3],[-10,9],[13,13],[-24,-4],[24,-6],[-40,-8],[40,-10]].forEach(([x,z],i)=>tree(x,z,.9+rnd(i+3)*.4));
function lamp(x,z){box(.3,5,.3,M('#333'),x,2.5,z);box(1.6,.25,.3,M('#333'),x+.6,5,z);box(.6,.3,.6,M('#fff6c0',{emissive:'#fff1a0',emissiveIntensity:.6}),x+1.3,4.85,z);}

// fountain in plaza

// ---------- clouds ----------
const clouds=new THREE.Group();scene.add(clouds);
const cloudMat=M('#ffffff',{roughness:1});
for(let i=0;i<26;i++){const g=new THREE.Group();const n=3+Math.floor(rnd(i)*3);for(let j=0;j<n;j++){const s=4+rnd(i*7+j)*5;const m=new THREE.Mesh(new THREE.BoxGeometry(s*1.6,s*.7,s),cloudMat);m.position.set(j*4-n*2,rnd(j+i)*1.5,rnd(j*3+i)*3);g.add(m);}
  g.position.set((rnd(i+50)-.5)*160,42+rnd(i+70)*14,(rnd(i+90)-.5)*160);clouds.add(g);}

// ---------- faces ----------
function face(kind){return canvasTex(256,256,(g)=>{g.fillStyle='#000';g.strokeStyle='#000';g.lineCap='round';
  const eye=(x,y,rx=13,ry=24)=>{g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();};
  const brow=(x1,y1,x2,y2)=>{g.lineWidth=10;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();};
  g.lineWidth=10;
  if(kind==='smile'){eye(96,100);eye(160,100);g.beginPath();g.arc(128,140,46,.18*Math.PI,.82*Math.PI);g.stroke();}
  if(kind==='grin'){eye(96,96);eye(160,96);g.beginPath();g.moveTo(74,140);g.quadraticCurveTo(128,230,182,140);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(92,146,72,16);}
  if(kind==='sad'){eye(96,108,12,20);eye(160,108,12,20);brow(76,92,112,76);brow(144,76,180,92);g.beginPath();g.arc(128,200,38,1.15*Math.PI,1.85*Math.PI);g.stroke();
     g.fillStyle='#4fb3ff';g.beginPath();g.ellipse(84,150,8,14,0,0,7);g.fill();}
  if(kind==='shock'){g.fillStyle='#fff';g.beginPath();g.arc(96,98,24,0,7);g.arc(160,98,24,0,7);g.fill();g.lineWidth=6;g.beginPath();g.arc(96,98,24,0,7);g.stroke();g.beginPath();g.arc(160,98,24,0,7);g.stroke();
     g.fillStyle='#000';g.beginPath();g.arc(96,98,9,0,7);g.arc(160,98,9,0,7);g.fill();g.beginPath();g.ellipse(128,176,22,30,0,0,7);g.fill();}
  if(kind==='angry'){eye(96,108,12,18);eye(160,108,12,18);brow(72,74,116,94);brow(140,94,184,74);g.beginPath();g.moveTo(96,178);g.lineTo(160,178);g.stroke();}
  if(kind==='smug'){eye(96,104,13,14);eye(160,104,13,14);brow(78,84,114,80);brow(142,76,178,70);g.beginPath();g.moveTo(92,160);g.quadraticCurveTo(140,182,176,146);g.stroke();}
  if(kind==='cry'){brow(76,96,116,104);brow(140,104,180,96);g.beginPath();g.moveTo(80,110);g.lineTo(112,110);g.moveTo(144,110);g.lineTo(176,110);g.stroke();
     g.fillStyle='#4fb3ff';g.fillRect(84,114,22,90);g.fillRect(150,114,22,90);g.fillStyle='#000';g.beginPath();g.ellipse(128,190,30,20,0,Math.PI,0);g.fill();}
  if(kind==='happy'){g.lineWidth=11;g.beginPath();g.arc(96,104,18,Math.PI*1.1,Math.PI*1.9);g.stroke();g.beginPath();g.arc(160,104,18,Math.PI*1.1,Math.PI*1.9);g.stroke();
     g.beginPath();g.moveTo(74,140);g.quadraticCurveTo(128,228,182,140);g.closePath();g.fill();}
});}
const FACES={};['smile','grin','sad','shock','angry','smug','cry','happy'].forEach(k=>FACES[k]=face(k));

// ---------- avatar ----------
function avatar(o){
  const root=new THREE.Group();scene.add(root);
  const hip=new THREE.Group();hip.position.y=2;root.add(hip);
  const torsoMat=M(o.torso);const torso=box(2,2,1,torsoMat,0,1,0,hip);
  const head=new THREE.Group();head.position.y=2.0;hip.add(head);
  const headMat=M(o.skin);const hm=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.15,24),headMat);hm.position.y=.6;hm.castShadow=true;head.add(hm);
  const topcap=new THREE.Mesh(new THREE.SphereGeometry(.62,24,8,0,Math.PI*2,0,Math.PI/2),headMat);topcap.scale.y=.25;topcap.position.y=1.17;head.add(topcap);
  const botcap=topcap.clone();botcap.rotation.x=Math.PI;botcap.position.y=.03;head.add(botcap);
  const faceMat=new THREE.MeshStandardMaterial({map:FACES[o.face||'smile'],transparent:true,roughness:.8});
  const fm=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.15),faceMat);fm.position.set(0,.6,.625);head.add(fm);
  const limb=(x,y,col)=>{const g=new THREE.Group();g.position.set(x,y,0);hip.add(g);box(1,2,1,M(col),0,-1,0,g);return g;};
  const armL=limb(-1.5,2,o.arms||o.skin),armR=limb(1.5,2,o.arms||o.skin);
  const legL=limb(-.5,0,o.legs),legR=limb(.5,0,o.legs);
  const A={root,hip,head,torso,torsoMat,faceMat,armL,armR,legL,legR,o};
  if(o.cap){box(1.36,.35,1.36,M(o.cap),0,1.2,0,head);box(1.1,.12,.7,M(o.cap),0,1.06,.9,head);}
  if(o.hair){box(1.4,.45,1.4,M(o.hair),0,1.15,-.05,head);box(1.4,.9,.35,M(o.hair),0,.75,-.55,head);}
  if(o.bun){const b=new THREE.Mesh(new THREE.SphereGeometry(.38,12,8),M(o.hair));b.position.set(0,1.55,-.2);head.add(b);}
  A.shades=new THREE.Group();box(1.2,.26,.08,M('#111',{roughness:.2,metalness:.6}),0,0,0,A.shades);A.shades.position.set(0,.76,.68);head.add(A.shades);A.shades.visible=!!o.shades;
  if(o.chain){const c=new THREE.Mesh(new THREE.TorusGeometry(.75,.08,8,24),M('#FFD23F',{metalness:.9,roughness:.25}));c.rotation.x=Math.PI/2.4;c.position.set(0,1.75,.25);hip.add(c);A.chain=c;}
  A.set=function(p){p=p||{};
    root.position.set(p.x||0,p.y||0,p.z||0);root.rotation.y=p.ry||0;root.scale.setScalar(p.s||1);
    const w=p.walk||0, sw=Math.sin(w*Math.PI*2)*(p.walkAmp??0.7);
    legL.rotation.x=sw;legR.rotation.x=-sw;
    armL.rotation.set(-(p.armL??-sw*0.8),0,p.armLz||0);armR.rotation.set(-(p.armR??sw*0.8),0,-(p.armRz||0));
    hip.position.y=2+(w?Math.abs(Math.cos(w*Math.PI*2))*.12:0)+(p.hop||0);
    hip.rotation.x=p.lean||0;hip.rotation.z=p.tilt||0;
    head.rotation.set(p.hx||0,p.hy||0,p.hz||0);
    if(p.face)faceMat.map=FACES[p.face];
  };
  return A;
}
const noob=avatar({skin:'#F5CD30',torso:'#0D69AC',legs:'#4B974B',face:'smile'});
const rich=avatar({skin:'#F2C9A0',torso:'#1b1b1f',arms:'#1b1b1f',legs:'#2a2a33',cap:'#111',chain:true,shades:true,face:'smug'});
const CROWD=[];
const CC=[['#C4A484','#E85D5D','#333','#4a2c1a'],['#8D5524','#F2A93B','#1f4e8a',null],['#F2C9A0','#7AC74F','#555','#e2c044'],['#E0AC69','#8E6BD8','#222','#1a1a1a'],
  ['#F5CD30','#F27FB0','#2b5','#7a3'],['#C68642','#3FBFA8','#333','#222'],['#F2C9A0','#ffffff','#5C8DE8','#b5651d'],['#8D5524','#E85D5D','#222','#111']];
CC.forEach((c,i)=>CROWD.push(avatar({skin:c[0],torso:c[1],arms:c[0],legs:c[2],hair:c[3]||undefined,face:'smile'})));
const crowdPos=[[-7,-2],[-4,6],[7,11],[7,1],[-9,3],[10,6],[-2,9],[2,-4]];

// ---------- props ----------

  const mat=M('#9aa4ad',{metalness:.6,roughness:.35,side:THREE.DoubleSide});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.85,.62,1.3,24,1,true),mat);b.position.y=.65;b.castShadow=true;g.add(b);

  const h=new THREE.Mesh(new THREE.TorusGeometry(.85,.04,6,24,Math.PI),M('#555'));h.position.y=1.3;g.add(h);return g;}
const bkt=bucket();
const bkt2=bucket(); // rich kid's empty bucket at end
const funnel=new THREE.Mesh(new THREE.CylinderGeometry(2.3,.8,2.2,28,1,true),M('#FF8A1F',{side:THREE.DoubleSide,map:studTex('#FF8A1F',[10,2])}));funnel.castShadow=true;scene.add(funnel);
const hammer=new THREE.Group();box(.18,1.2,.18,M('#7a4a26'),0,.6,0,hammer);box(.6,.35,.35,M('#888',{metalness:.7}),0,1.2,0,hammer);
// truck
const truck=new THREE.Group();scene.add(truck);
const tMat=M('#7B2FF7',{map:studTex('#7B2FF7',[6,2])});
box(9,3,4,tMat,0,2.3,0,truck);box(3,3.2,4,M('#2b2b33'),5.8,2.4,0,truck);box(.1,1.4,3.4,M('#9fd8ff',{roughness:.1,metalness:.3}),7.32,3,0,truck);
[[-3,2.1],[3,2.1],[5.8,2.1],[-3,-2.1],[3,-2.1],[5.8,-2.1]].forEach(([x,z])=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.7,16),M('#111'));w.rotation.x=Math.PI/2;w.position.set(x,1,z);w.castShadow=true;truck.add(w);});

const dollar=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#7B2FF7';g.fillRect(0,0,w,h);g.fillStyle='#FFE600';g.font='bold 110px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText('VAC-9000',w/2,h/2+4);});

const hoseCurve=new THREE.CatmullRomCurve3([V(-3.5,6.5,0),V(-5,10,0),V(-4,15,0),V(-1,19,0)]);

const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(1.6,.6,1.6,20,1,true),M('#555',{side:THREE.DoubleSide}));nozzle.position.set(-1,19.6,0);truck.add(nozzle);
const TRUCK_POS=V(14,0,-3);
// explosion

// tornado (cone of swirling bills uses particles; plus translucent funnel)

box(26,1,20,M('#7d8590',{map:studTex('#7d8590',[13,10])}),0,-12.5,0,vault);// vault floor

const grassTop=box(28,1,22,M('#4CB04C',{map:studTex('#4CB04C',[14,11])}),0,14,0,vault);
box(26,12,1,M('#8a929c',{map:studTex('#8a929c',[13,6])}),0,-6.5,-7,vault);// vault back wall
const vdoor=new THREE.Mesh(new THREE.CylinderGeometry(3.6,3.6,.6,32),M('#b9c0c8',{metalness:.8,roughness:.3}));vdoor.rotation.x=Math.PI/2;vdoor.position.set(-7,-6.5,-6.3);vault.add(vdoor);
for(let i=0;i<6;i++){const s=box(.3,3,.3,M('#777',{metalness:.8}),-7,-6.5,-5.9,vault);s.rotation.z=i*Math.PI/6;}

function placeBills(mode,t,tl,opt={}){
  let n=0;
  for(let i=0;i<NB;i++){
    const a=rnd(i),b=rnd(i+NB),c=rnd(i+2*NB),d=rnd(i+3*NB);
    let x=0,y=-100,z=0;
    if(mode==='rain'){const Hh=40,sp=5+c*3;const cx=opt.cx||0,cz=opt.cz||0,R=opt.R||30;x=cx+(a-.5)*R*2+Math.sin(t*1.3+i)*.6;z=cz+(b-.5)*R*2;y=Hh-((t*sp+d*Hh)%Hh);
      if(opt.density!==undefined&&a>opt.density){y=-100;}}
    else if(mode==='storm'){const Hh=34,ang=t*(2.2+c)+a*40,h=((t*3+d*Hh)%Hh);const r=1.5+h/Hh*8+b*1.2;x=opt.cx+Math.cos(ang)*r;z=opt.cz+Math.sin(ang)*r;y=h;}
    else if(mode==='suck'){const tc=(opt.k*1.6+d)%1;const st=V(opt.cx+(a-.5)*40,4+b*30,opt.cz+(c-.5)*40);const en=opt.nozzle;const p=st.lerp(en,Math.pow(tc,1.7));x=p.x;y=p.y;z=p.z;if(i%2)y=-100;}
    else if(mode==='burst'){const k=tl;const dir=V(a-.5,.4+b*.9,c-.5).normalize();const v=14+d*22;x=opt.cx+dir.x*v*k;z=opt.cz+dir.z*v*k;y=Math.max(0.05,8+dir.y*v*k-6*k*k*4);}
    else if(mode==='funnel'){const Hh=30,sp=10+c*4;const h=Hh-((t*sp+d*Hh)%Hh);const spread=Math.min(1,h/18);x=opt.cx+(a-.5)*14*spread;z=opt.cz+(b-.5)*14*spread;y=h+1.2; if(h<1.3)y=-100;}
    else if(mode==='pipe'){const k=(t*1.4+d)%1;x=opt.cx+(a-.5)*.6;z=opt.cz+(b-.5)*.6;y=opt.top-k*(opt.top-opt.bot);if(i%3)y=-100;}
    dmy.position.set(x,y,z);
    dmy.rotation.set(t*(2+a*4)+i,t*(1+b*3)+i*2,t*(1.5+c)+i);
    if(mode==='burst'&&y<=.06)dmy.rotation.set(-Math.PI/2,0,i);
    dmy.scale.setScalar(y<-50?0:1);dmy.updateMatrix();bills.setMatrixAt(i,dmy.matrix);
  }
  bills.instanceMatrix.needsUpdate=true;
}

    noob.torsoMat.color.set('#FFB300');noob.torsoMat.metalness=.35;noob.torsoMat.roughness=.3;noob.torsoMat.emissive.set('#3a2600');noob.shades.visible=true;bkt.visible=false;funnel.visible=false;truck.visible=false;
    const g=ease(k*1.5);skyU.top.value.set('#3E8EEA').lerp(new THREE.Color('#f0b030'),g);skyU.bot.value.set('#BFE6FF').lerp(new THREE.Color('#ffe8a0'),g);scene.fog.color.copy(skyU.bot.value);
    cloudMat.color.set('#ffffff').lerp(new THREE.Color('#ffcf4a'),g);
    placeGold(k>.42,t);
    noob.set({x:0,z:2,face:'shock',hx:-.6});rich.set({x:4,z:3,ry:-.4,face:'shock',hx:-.6});
    CROWD.forEach((c,i)=>c.set({x:crowdPos[i][0],z:crowdPos[i][1],ry:Math.atan2(-crowdPos[i][0],8-crowdPos[i][1]),face:'shock',hx:-.6}));
    const tk=ease((k-.25)/.55);
    look(V(1,lerp(6.5,4,tk),17),vl(V(.5,4,2),V(1,22,-6),tk));camera.fov=lerp(40,60,tk);camera.fov=50;
    document.getElementById('black').style.opacity=k>.84?1:0;
    document.getElementById('end').style.opacity=k>.88?1:0;
    wipe(tl);
  }
};

// ---------- captions ----------
const cap=document.getElementById('cap');
function captions(t){
  let html='';
  for(const L of TL.lines){if(!L.words)continue;
    if(t<L.vo0-0.05||t>L.vo1+0.25)continue;
    // chunk into groups of <=3 words
    const ch=[];let cur=[];L.words.forEach(w=>{cur.push(w);if(cur.length===3||/[.,!?]$/.test(w.w)){ch.push(cur);cur=[];}});if(cur.length)ch.push(cur);
    let pick=ch[0];for(const c of ch)if(t>=c[0].t0-0.03)pick=c;
    html=pick.map(w=>{const on=t>=w.t0-0.03;const age=t-w.t0;const s=on?(age<.09?0.6+age/.09*0.55:age<.16?1.15-(age-.09)/.07*.15:1):0;
      return `<span class="${w.hi?'hi':''}" style="transform:scale(${s.toFixed(3)});opacity:${on?1:0}">${w.w}</span>`;}).join('');
  }
  cap.innerHTML=html;
}

window.renderAt=function(t){
  reset();
  let S=TL.scenes[0];for(const s of TL.scenes)if(t>=s.t0)S=s;
  const d=S.t1-S.t0,tl=t-S.t0,k=clamp(tl/d);
  SHOTS[S.shot](t,k,tl,d);
  camera.updateProjectionMatrix();
  sun.target.position.copy(camera.position).setY(0);sun.position.copy(sun.target.position).add(V(30,60,25));
  captions(t);
  renderer.render(scene,camera);
  return {scene:S.shot};
};
window.ENGINE_READY=true;
</script></body></html>
