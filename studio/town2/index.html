<!doctype html>
<html><head><meta charset="utf-8">
<style>

canvas{display:block;position:absolute;left:0;top:0}

  -webkit-text-stroke:5px #1a1a1a;paint-order:stroke fill;text-shadow:0 3px 8px rgba(0,0,0,.55);letter-spacing:.5px}

</style></head><body>
<div id="grade"></div><div id="cap"></div><div id="black"></div>
<script type="module">
import * as THREE from './three.module.min.js';
const W=1080,H=1920;
const TL=await (await fetch('timeline.json')).json();
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,W/H,.1,600);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const lerp=(a,b,k)=>a+(b-a)*k;const V=(x,y,z)=>new THREE.Vector3(x,y,z);const vl=(a,b,k)=>a.clone().lerp(b,k);
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
function box(w,h,d,mat,x=0,y=0,z=0,p=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;p.add(m);return m;}

// ---------- atmosphere ----------
const FOG_DAY=new THREE.Color('#b9c3d0'),FOG_NIGHT=new THREE.Color('#7f8ca3');
scene.background=FOG_DAY.clone();scene.fog=new THREE.FogExp2(FOG_DAY.clone(),.018);
const hemi=new THREE.HemisphereLight('#dfe8f5','#8a93a0',1.6);scene.add(hemi);
const sun=new THREE.DirectionalLight('#eef3ff',1.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=6;
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:200});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
function mood(night){scene.background.copy(FOG_DAY).lerp(FOG_NIGHT,night);scene.fog.color.copy(scene.background);
  hemi.intensity=lerp(1.6,1.0,night);sun.intensity=lerp(1.4,.7,night);scene.fog.density=lerp(.018,.016,night);}

// ---------- ground ----------
const tileTex=tex(256,256,(g,w,h)=>{g.fillStyle='#cfd4db';g.fillRect(0,0,w,h);for(let i=0;i<600;i++){g.fillStyle=`rgba(0,0,0,${rnd(i)*.04})`;g.fillRect(rnd(i+1)*w,rnd(i+2)*h,3,3);}
  g.strokeStyle='#9aa1ab';g.lineWidth=3;g.strokeRect(0,0,w,h);},[150,150]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),M('#ffffff',{map:tileTex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadTex=tex(128,512,(g,w,h)=>{g.fillStyle='#5f6672';g.fillRect(0,0,w,h);for(let i=0;i<300;i++){g.fillStyle=`rgba(255,255,255,${rnd(i)*.05})`;g.fillRect(rnd(i+3)*w,rnd(i+4)*h,2,2);}
  g.fillStyle='#f2f2f2';g.fillRect(w/2-4,40,8,180);g.fillStyle='#e8d24a';},[1,40]);
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,400),M('#fff',{map:roadTex}));road.rotation.x=-Math.PI/2;road.position.set(0,.02,-60);road.receiveShadow=true;scene.add(road);
for(const s of[-1,1]){box(.4,.25,400,M('#aeb4bd'),s*4.7,.12,-60).castShadow=false;}
// crosswalk
for(let i=-3;i<=3;i++)box(.9,.03,3,M('#f0f0f0'),i*1.25,.03,14).castShadow=false;

// ---------- houses / apartments ----------
function winTex(base,door=true){return tex(256,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<200;i++){g.fillStyle=`rgba(0,0,0,${rnd(i)*.04})`;g.fillRect(rnd(i+7)*w,rnd(i+8)*h,6,2);}
  const win=(x,y)=>{g.fillStyle='#f4f4f4';g.fillRect(x-4,y-4,58,70);g.fillStyle='#7d8da3';g.fillRect(x,y,50,62);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(x+4,y+4,12,54);g.fillStyle='#f4f4f4';g.fillRect(x+23,y,4,62);};
  win(30,50);win(176,50);if(door){g.fillStyle='#6b4a33';g.fillRect(104,150,50,106);g.fillStyle='#d8c28a';g.fillRect(142,200,6,6);}else{win(30,160);win(176,160);}
});}
function aptTex(base){return tex(256,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let y=20;y<h-20;y+=56)for(let x=16;x<w-20;x+=60){g.fillStyle='#e9e9e9';g.fillRect(x-3,y-3,40,46);g.fillStyle='#6f7f95';g.fillRect(x,y,34,40);}});}
const HCOL=['#9fc3b0','#d9c3a5','#b7a8c9','#e0b9a3','#a8bcd0','#c9cfa0'];
const houses=[];
function house(x,z,i,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);const col=HCOL[i%HCOL.length];
  box(9,6,9,M('#fff',{map:winTex(col)}),0,3,0,g);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(7.2,3.6,4),M(i%2?'#8a5a4a':'#6d7685',{flatShading:true}));roof.rotation.y=Math.PI/4;roof.position.y=7.8;roof.castShadow=true;g.add(roof);
  box(1,2.4,1,M('#8b8b8b'),2.5,8.6,-1.5,g);
  // mailbox + fence
  box(.2,1.4,.2,M('#6b4a33'),-3,.7,6.2,g);box(.6,.5,.9,M('#c4453b'),-3,1.5,6.2,g);
  for(let f=-4;f<=4;f+=1)box(.18,1.1,.12,M('#efe6d6'),f,.55,7.5,g);box(9,.15,.12,M('#efe6d6'),0,.85,7.5,g);
  houses.push(g);return g;}
for(let i=0;i<9;i++){house(-16,20-i*14,i,Math.PI/2);house(16,20-i*14,i+3,-Math.PI/2);}
const miloHouse=houses[1]; // right side, z=20? (index1 => x=16,z=20)
const APC=['#b0795f','#c98c6a','#9b9ea6','#c9b28f'];
[[-34,10],[-30,-30],[34,-6],[32,-46],[-36,-70],[36,-86],[-28,40],[30,40]].forEach(([x,z],i)=>{const h=18+rnd(i)*14;const m=box(12,h,12,M('#fff',{map:aptTex(APC[i%4])}),x,h/2,z);});
// trees
function tree(x,z,s=1){box(.5*s,2.6*s,.5*s,M('#7b5b43'),x,1.3*s,z);const c=new THREE.Mesh(new THREE.IcosahedronGeometry(2*s,0),M('#89a97a',{flatShading:true}));c.position.set(x,3.6*s,z);c.castShadow=true;scene.add(c);
  const c2=new THREE.Mesh(new THREE.IcosahedronGeometry(1.3*s,0),M('#9bb98a',{flatShading:true}));c2.position.set(x+.6*s,4.8*s,z-.3);c2.castShadow=true;scene.add(c2);}
for(let i=0;i<9;i++){tree(-9.5,13-i*14,.9+rnd(i)*.3);tree(9.5,6-i*14,.9+rnd(i+20)*.3);}
// street lamps
const lampOn=M('#fff6d8',{emissive:'#ffe9b0',emissiveIntensity:1.2});const lampOff=M('#8c8f94');

function lamp(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(.25,7,.25,M('#4a4f57'),0,3.5,0,g);box(1.8*s,.2,.25,M('#4a4f57'),.9*s,7,0,g);
  const head=box(.9,.25,.6,lampOn,1.7*s,6.85,0,g);head.castShadow=false;lamps.push(head);return g;}
for(let i=0;i<8;i++){lamp(-6.2,8-i*12,1);lamp(6.2,2-i*12,-1);}
const lastLamp=lamp(-2.5,-50,1);const lastLight=new THREE.PointLight('#ffe6b0',0,40,1.2);lastLight.position.set(-.8,6.6,-50);scene.add(lastLight);

// ---------- rain ----------
const NR=1800;const rain=new THREE.InstancedMesh(new THREE.BoxGeometry(.025,.7,.025),new THREE.MeshBasicMaterial({color:'#e6edf7',transparent:true,opacity:.55}),NR);scene.add(rain);
const dmy=new THREE.Object3D();
function placeRain(t,amt=1){const c=camera.position;for(let i=0;i<NR;i++){const on=rnd(i+9)<amt;const Hh=26;const y=c.y+12-((t*22+rnd(i)*Hh)%Hh);
  dmy.position.set(c.x+(rnd(i+1)-.5)*30+(y-c.y)*.12,y,c.z+(rnd(i+2)-.5)*30);dmy.rotation.set(0,0,.12);dmy.scale.setScalar(on?1:0);dmy.updateMatrix();rain.setMatrixAt(i,dmy.matrix);}rain.instanceMatrix.needsUpdate=true;}

// ---------- faces ----------
function face(kind){return tex(256,256,(g)=>{g.lineCap='round';g.lineJoin='round';
  const eye=(x,y,o={})=>{const rx=o.rx||17,ry=o.ry||20;g.fillStyle='#fff';g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();g.lineWidth=5;g.strokeStyle='#111';g.stroke();
    g.fillStyle='#111';g.beginPath();g.ellipse(x+(o.px||0),y+(o.py||2),o.pr||8,o.pr?o.pr*1.1:10,0,0,7);g.fill();if(o.lid){g.fillStyle=o.skin||'#E8C39E';g.fillRect(x-rx-4,y-ry-4,rx*2+8,ry*o.lid);g.beginPath();g.moveTo(x-rx,y-ry+ry*o.lid);g.lineTo(x+rx,y-ry+ry*o.lid);g.stroke();}};

  const ml=(path)=>{g.strokeStyle='#111';g.lineWidth=6;g.beginPath();path();g.stroke();};
  if(kind==='neutral'){eye(92,104);eye(164,104);brow(72,74,110,72);brow(146,72,184,74);ml(()=>{g.moveTo(108,172);g.lineTo(150,170);});}
  if(kind==='smug'){eye(92,106,{lid:.9,px:4});eye(164,106,{lid:.9,px:4});brow(72,80,110,78);brow(146,70,184,62);ml(()=>{g.moveTo(96,170);g.quadraticCurveTo(140,188,168,158);});}
  if(kind==='whistle'){eye(92,100,{ry:18,py:-4});eye(164,100,{ry:18,py:-4});brow(72,68,110,64);brow(146,64,184,68);g.fillStyle='#111';g.beginPath();g.ellipse(128,174,9,11,0,0,7);g.fill();g.strokeStyle='#111';g.lineWidth=5;g.beginPath();g.ellipse(128,174,15,17,0,0,7);g.stroke();}
  if(kind==='grin'){g.strokeStyle='#111';g.lineWidth=7;g.beginPath();g.arc(92,110,16,Math.PI*1.1,Math.PI*1.9);g.stroke();g.beginPath();g.arc(164,110,16,Math.PI*1.1,Math.PI*1.9);g.stroke();brow(72,70,110,66);brow(146,66,184,70);
    g.fillStyle='#111';g.beginPath();g.moveTo(88,152);g.quadraticCurveTo(128,214,168,152);g.closePath();g.fill();g.fillStyle='#fff';g.fillRect(98,154,60,12);}
  if(kind==='worried'){eye(92,108,{pr:7});eye(164,108,{pr:7});brow(74,82,110,70);brow(146,70,182,82);ml(()=>{g.moveTo(104,178);g.quadraticCurveTo(128,166,152,178);});}
  if(kind==='scared'){eye(92,104,{rx:20,ry:24,pr:5});eye(164,104,{rx:20,ry:24,pr:5});brow(70,74,110,60);brow(146,60,186,74);g.fillStyle='#111';g.beginPath();g.ellipse(128,180,16,20,0,0,7);g.fill();}
  if(kind==='shut'){g.strokeStyle='#111';g.lineWidth=7;g.beginPath();g.moveTo(74,108);g.lineTo(108,102);g.moveTo(148,102);g.lineTo(182,108);g.stroke();brow(72,84,110,74);brow(146,74,184,84);ml(()=>{g.moveTo(104,176);g.lineTo(152,176);});}
});}
const FACES={};['neutral','smug','whistle','grin','worried','scared','shut'].forEach(k=>FACES[k]=face(k));

// ---------- avatar (layered clothing style) ----------
const jacketTex=tex(256,256,(g,w,h)=>{g.fillStyle='#24345a';g.fillRect(0,0,w,h);g.fillStyle='#f0f0f0';g.beginPath();g.moveTo(80,0);g.lineTo(128,70);g.lineTo(176,0);g.fill();
  g.fillStyle='#1b2846';g.fillRect(124,60,8,196);g.fillStyle='#d9b24a';g.font='bold 34px Arial';g.fillText('M',176,120);g.fillStyle='#e3e3e3';g.fillRect(0,236,w,10);});
const sleeveTex=tex(64,128,(g,w,h)=>{g.fillStyle='#d6d9df';g.fillRect(0,0,w,h);g.fillStyle='#24345a';g.fillRect(0,0,w,40);g.fillStyle='#24345a';g.fillRect(0,96,w,32);g.fillStyle='#d9b24a';g.fillRect(0,100,w,5);g.fillRect(0,110,w,5);});
const jeansTex=tex(64,128,(g,w,h)=>{g.fillStyle='#3d5a86';g.fillRect(0,0,w,h);for(let i=0;i<60;i++){g.fillStyle=`rgba(255,255,255,${rnd(i)*.06})`;g.fillRect(rnd(i+5)*w,rnd(i+6)*h,8,2);}g.fillStyle='#e8e8e8';g.fillRect(0,112,w,16);});
function avatar(o){
  const root=new THREE.Group();scene.add(root);const hip=new THREE.Group();hip.position.y=2;root.add(hip);
  const torso=box(2,2,1,o.torsoMat||M(o.torso),0,1,0,hip);
  const head=new THREE.Group();head.position.y=2;hip.add(head);const skin=M(o.skin);
  const hm=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.15,24),skin);hm.position.y=.6;hm.castShadow=true;head.add(hm);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.62,24,8,0,Math.PI*2,0,Math.PI/2),skin);cap.scale.y=.25;cap.position.y=1.17;head.add(cap);const cap2=cap.clone();cap2.rotation.x=Math.PI;cap2.position.y=.03;head.add(cap2);
  const faceMat=new THREE.MeshStandardMaterial({map:FACES[o.face||'neutral'],transparent:true,roughness:.9});
  const fm=new THREE.Mesh(new THREE.PlaneGeometry(1.15,1.15),faceMat);fm.position.set(0,.6,.626);head.add(fm);
  if(o.hair){const hm2=M(o.hair,{flatShading:true});const base=new THREE.Mesh(new THREE.CylinderGeometry(.7,.68,.5,12),hm2);base.position.y=1.15;head.add(base);
    box(1.4,.9,.35,hm2,0,.85,-.5,head);
    for(let i=0;i<9;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.28,.9,5),hm2);const a=i/9*Math.PI*2;s.position.set(Math.cos(a)*.38,1.45,Math.sin(a)*.38-.05);s.rotation.set(Math.sin(a)*.8,0,-Math.cos(a)*.8);s.castShadow=true;head.add(s);}
    const fr=new THREE.Mesh(new THREE.ConeGeometry(.35,1.1,5),hm2);fr.position.set(.1,1.3,.5);fr.rotation.set(1.1,0,-.3);head.add(fr);}
  if(o.beard){box(1.3,.55,.2,M(o.beard),0,.25,.6,head);box(1.36,.35,1.36,M(o.beard),0,1.25,0,head);}
  const limb=(x,y,mat)=>{const g=new THREE.Group();g.position.set(x,y,0);hip.add(g);box(1,2,1,mat,0,-1,0,g);return g;};
  const armMat=o.armMat||M(o.arms||o.skin),legMat=o.legMat||M(o.legs);
  const armL=limb(-1.5,2,armMat),armR=limb(1.5,2,armMat),legL=limb(-.5,0,legMat),legR=limb(.5,0,legMat);
  const A={root,hip,head,faceMat,armL,armR,legL,legR};
  A.set=p=>{p=p||{};root.position.set(p.x||0,p.y||0,p.z||0);root.rotation.set(p.rx||0,p.ry||0,p.rz||0);
    const w=p.walk||0,amp=p.amp??.6,sw=Math.sin(w*Math.PI*2)*amp;legL.rotation.x=sw;legR.rotation.x=-sw;
    armL.rotation.set(-(p.armL??-sw*.9),0,p.armLz||0);armR.rotation.set(-(p.armR??sw*.9),0,-(p.armRz||0));
    hip.position.y=2+(w?Math.abs(Math.cos(w*Math.PI*2))*.1*amp:0);hip.rotation.x=p.lean||0;head.rotation.set(p.hx||0,p.hy||0,p.hz||0);
    if(p.face)faceMat.map=FACES[p.face];root.visible=p.hide?false:true;};
  return A;}
const milo=avatar({skin:'#E8C39E',torsoMat:M('#fff',{map:jacketTex}),armMat:M('#fff',{map:sleeveTex}),legMat:M('#fff',{map:jeansTex}),hair:'#2b1d16',face:'neutral'});
const NB=[{skin:'#C68E5E',torso:'#7d9c6a',legs:'#3f4652',hair:'#1a1a1a'},{skin:'#EFD2B4',torso:'#a35b4e',legs:'#2c3440',beard:'#e8e8e8'},{skin:'#8D5B3A',torso:'#c9b38a',legs:'#5b5b66',hair:'#3a2a20'}].map(o=>avatar(o));
const bag=new THREE.Group();scene.add(bag);box(.9,1.1,.5,M('#b98b5a'),0,0,0,bag);box(.95,.12,.55,M('#a37a4d'),0,.5,0,bag);const bread=box(.25,.5,.25,M('#d9b45a'),.2,.75,0,bag);

// ---------- the Tall Man ----------
const gm=M('#a3abb5',{roughness:1});
function tallMan(scale=1){const R=new THREE.Group();scene.add(R);const body=new THREE.Group();R.add(body);
  const legL=new THREE.Group(),legR=new THREE.Group();legL.position.set(-.7,10,0);legR.position.set(.7,10,0);body.add(legL,legR);
  box(.7,10,.7,gm,0,-5,0,legL);box(.7,10,.7,gm,0,-5,0,legR);box(1,.5,1.8,gm,0,-9.9,.4,legL);box(1,.5,1.8,gm,0,-9.9,.4,legR);
  const chest=new THREE.Group();chest.position.y=10;body.add(chest);chest.rotation.x=.25;
  const tor=new THREE.Mesh(new THREE.CylinderGeometry(1.3,.8,6,8),gm);tor.position.y=3;tor.castShadow=true;chest.add(tor);
  const neck=new THREE.Group();neck.position.y=6;chest.add(neck);neck.rotation.x=.35;
  box(.5,1.6,.5,gm,0,.8,0,neck);const head=new THREE.Group();head.position.y=1.6;neck.add(head);
  box(1.4,2.6,1.3,gm,0,1.2,0,head);const eyeM=new THREE.MeshBasicMaterial({color:'#15161a'});box(.35,.55,.1,eyeM,-.35,1.7,.66,head);box(.35,.55,.1,eyeM,.35,1.7,.66,head);
  const mouth=box(.7,.12,.1,eyeM,0,.6,.66,head);
  const arm=s=>{const a=new THREE.Group();a.position.set(s*1.5,5.6,0);chest.add(a);box(.45,5,.45,gm,0,-2.5,0,a);const fore=new THREE.Group();fore.position.y=-5;a.add(fore);box(.4,5,.4,gm,0,-2.5,0,fore);
    const hand=new THREE.Group();hand.position.y=-5;fore.add(hand);box(.8,.8,.3,gm,0,-.4,0,hand);for(let f=0;f<4;f++){box(.12,1.4,.12,gm,-.3+f*.2,-1.4,0,hand);}box(.12,.9,.12,gm,s*.45,-.7,.1,hand);
    return {a,fore,hand};};
  const AL=arm(-1),AR=arm(1);
  const T={R,body,chest,neck,head,AL,AR,mouth};
  T.set=p=>{p=p||{};R.position.set(p.x||0,0,p.z||0);R.rotation.y=p.ry||0;R.scale.setScalar(p.s||scale);R.visible=!p.hide;
    neck.rotation.set(.35+(p.nod||0),0,p.tilt||0);
    AL.a.rotation.set(p.aL||.05,0,.12);AL.fore.rotation.x=p.fL||-.1;AR.a.rotation.set(p.aR||.05,0,-.12);AR.fore.rotation.x=p.fR||-.1;AR.a.rotation.z=-(p.aRz??.12);
    const w=p.walk||0;legL.rotation.x=Math.sin(w*Math.PI*2)*.35;legR.rotation.x=-Math.sin(w*Math.PI*2)*.35;};
  return T;}
const tall=tallMan();
const crowd=[];for(let i=0;i<9;i++)crowd.push(tallMan(.42+rnd(i)*.22));

// captions: 3 words at a time, lowercase, top of frame
const capEl=document.getElementById('cap');
function captions(t){let txt='';for(const L of TL.lines){if(t<L.vo0-.05||t>L.vo1+.2)continue;
  const ch=[];for(let i=0;i<L.words.length;i+=3)ch.push(L.words.slice(i,i+3));let pick=ch[0];for(const c of ch)if(t>=c[0].t0-.05)pick=c;
  txt=pick.map(w=>w.w).join(' ');}capEl.textContent=txt;}
window.renderAt=function(t){reset();let sc=TL.scenes[0];for(const s of TL.scenes)if(t>=s.t0)sc=s;
  const k=clamp((t-sc.t0)/(sc.t1-sc.t0));S[sc.shot](t,k);camera.updateProjectionMatrix();
  sun.target.position.copy(camera.position).setY(0);sun.position.copy(sun.target.position).add(V(-20,50,30));
  captions(t);renderer.render(scene,camera);return sc.shot;};
