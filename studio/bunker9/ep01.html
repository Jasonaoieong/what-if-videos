<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
@font-face { font-family: SpecialElite; src: url(fonts/SpecialElite.ttf); }
html, body { margin: 0; background: #000; overflow: hidden; }
svg { display: block; }
</style></head>
<body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="holeGrad"><stop offset="0" stop-color="#000"/><stop offset="0.55" stop-color="#000" stop-opacity="0.85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="coneblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="fogblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></radialGradient>
  </defs>
  <g id="world"></g>
  <rect width="1080" height="1920" fill="url(#vig)"/>
  <rect width="1080" height="1920" filter="url(#grain)" opacity="0.10"/>
  <g id="ui"></g>
</svg>
<script src="stick.js"></script>
<script src="set.js"></script>
<script>
const L_ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const B = window.Bunker, ST = window.Stick;
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const between = (t, a, b) => t >= a && t < b;
const pop = (t, t0, d = 0.16) => { const x = (t - t0) / d; if (x < 0) return 0; if (x > 1) return 1; return ease(x) + Math.sin(x * Math.PI) * 0.15; };
function cam(cx, cy, z) { return `translate(540 960) scale(${z.toFixed(4)}) translate(${(-cx).toFixed(1)} ${(-cy).toFixed(1)})`; }
function mouth(t, who) { const m = (EP.mouth || {})[who] || [], i = Math.floor(t * EP.fps); return i >= 0 && i < m.length ? m[i] : 0; }
function blink(t, off = 0) { const ph = (t + off) % 3.7; return Math.max(0, 1 - Math.abs(ph - 3.5) / 0.07); }
function flick(t, amt = 0.08) { return (Math.sin(t * 37) * Math.sin(t * 13.3) > 0.82 ? amt * 3 : 0) + Math.sin(t * 61) * amt * 0.2; }
function sceneAt(t) {
  const ls = EP.lines;
  for (let i = ls.length - 1; i >= 0; i--) { const t0 = i === 0 ? 0 : ls[i].t0 - 0.12; if (t >= t0) return { i, line: ls[i], t0, t1: i + 1 < ls.length ? ls[i + 1].t0 - 0.12 : EP.dur }; }
}
function who(p, t) {
  const sp = { milo: 'MILO', june: 'JUNE', hal: 'HAL', priya: 'PRIYA', teddy: 'TEDDY', dante: 'DANTE' }[p.who];
  return ST.svg(Object.assign({ t, talk: mouth(t, sp), blink: blink(t, p.x * 0.01) }, p));
}
const CAPCOL = { RADIO: '#FFB86B',  MAE: '#CDB2FF', MILO: '#FFD23F', HAL: '#A8D17E', JUNE: '#FF7A6E', DANTE: '#FFA552', PRIYA: '#F2F2F2', TEDDY: '#9FD3FF', NARR: '#F2F2F2' };

const SCENES = {
  alert(t, k, tl) { return B.alert(t, k); },
  street_run(t, k, tl) {
    const mx = lerp(150, 760, k);
    let s = `<g transform="${cam(lerp(360, 760, k), 1040, 1.0)}">` + B.city(t, { missile: lerp(0.15, 0.6, k) });
    const npcs = [['npc1', 1400, -1, 0.95], ['npc2', 1700, -1, 0.9], ['npc3', -200, 1, 1.0], ['npc4', 1100, -1, 0.85], ['npc2', 300, 1, 0.8]];
    npcs.forEach(([w, x0, dir, sc], i) => { s += ST.svg({ who: w, x: x0 + dir * tl * 420, y: 1500 + (i % 2) * 40, scale: sc, t, expr: 'terror', walk: tl * 3 + i * 0.3, flip: dir < 0, armL: 2.4, armR: 2.6, bendL: 0.4, bendR: 0.4 }); });
    s += ST.svg({ who: 'mae', x: mx - 150, y: 1560, scale: 0.62, t, expr: 'terror', walk: tl * 3.4, armR: 2.0, bendR: -0.2 });
    s += who({ who: 'milo', x: mx, y: 1560, expr: 'terror', walk: tl * 3, armL: 1.25, bendL: 0.3, lean: 8 }, t);
    s += B.dark(0.25, [], [], '#2A0A05');
    return s + `</g>`;
  },
  garage_rush(t, k, tl) {
    let s = `<g transform="${cam(620, 1060, 1.05)}">` + B.garage(t, { open: 1 });
    s += who({ who: 'hal', x: 920, y: 1500, expr: 'stern', armR: 2.5 + Math.sin(t * 9) * 0.3, bendR: -0.3, flip: true }, t);
    [['npc3', 200], ['npc1', 360], ['npc4', 80]].forEach(([w, x0], i) => { const x = x0 + tl * 300; if (x < 640) s += ST.svg({ who: w, x, y: 1500, scale: 0.9, t, expr: 'terror', walk: tl * 3 + i, armL: 2.3, armR: 2.3 }); });
    s += ST.svg({ who: 'mae', x: lerp(-60, 260, k) - 140, y: 1600, scale: 0.68, t, expr: 'terror', walk: tl * 3.4, armR: 2.0, bendR: -0.2 });
    s += who({ who: 'milo', x: lerp(-60, 260, k), y: 1600, expr: 'terror', walk: tl * 3, armL: 1.25, bendL: 0.3, lean: 6 }, t);
    s += B.dark(0.45, [{ x: 630, y: 1100, r: 600 }], [], '#05050A');
    return s + `</g>`;
  },
  separation(t, k, tl) {
    const pull = L_ease((tl - 0.3) / 0.9);
    let s = `<g transform="${cam(540, 1080, 1.5)}">` + B.garage(t, { open: 1 });
    for (let i = 0; i < 3; i++) s += ST.svg({ who: ['npc1', 'npc2', 'npc4'][i], x: 330 + i * 200 + Math.sin(t * 6 + i) * 20, y: 1470, scale: 0.85, t, expr: 'terror', walk: tl * 3 + i, armL: 2.2, armR: 2.2 });
    s += who({ who: 'milo', x: 760, y: 1560, expr: 'terror', armL: lerp(1.3, 1.65, pull), bendL: 0.1, lean: -6 }, t);
    s += ST.svg({ who: 'mae', x: lerp(560, 240, pull), y: 1600, scale: 0.72, t, expr: 'terror', armR: 2.0, bendR: -0.1, talk: mouth(t, 'MAE') });
    s += B.dark(0.45 + flick(t), [{ x: 600, y: 1060, r: 520 }], [], '#05050A');
    return s + `</g>`;
  },
  door_slam(t, k, tl) {
    const close = L_ease(tl / 1.0);
    let s = `<g transform="${cam(560, 1100, 1.25)}">` + B.garage(t, { open: 1 - close });
    s += ST.svg({ who: 'mae', x: 300, y: 1560, scale: 0.72, t, expr: 'sad', armR: 1.9, bendR: -0.2, look: { x: 1, y: -0.3 } });
    s += B.dark(0.6, [{ x: 630, y: 1100, r: 520 * (1 - close) + 120 }], [], '#05050A');
    return s + `</g>`;
  },
  flash(t, k, tl) {
    if (tl < 1.2) {
      let s = `<g transform="${cam(540, 1000, 1.0 + tl * 0.05)}">` + B.city(t, { missile: 1 }) + `</g>`;
      return s + `<rect width="1080" height="1920" fill="#FFFFFF" opacity="${Math.max(0, 1 - tl / 1.2).toFixed(2)}"/>`;
    }
    const sh = Math.sin(t * 80) * 14 * Math.max(0, 1 - (tl - 1.2) / 1.5);
    let s = `<g transform="translate(${sh.toFixed(1)} ${(sh * 0.6).toFixed(1)})"><g transform="${cam(1000, 1010, 1.0)}">` + B.bunkroom(t * 4);
    s += B.dust(t, 60, 1) + B.dark(0.7 + flick(t, 0.3), [{ x: 1020, y: 600, r: 520 }]) + `</g></g>`;
    return s;
  },
  radio(t, k, tl) {
    if (tl < 1.3) return `<rect width="1080" height="1920" fill="#000"/><text x="540" y="980" text-anchor="middle" font-family="SpecialElite" font-size="96" fill="#E4E1DA" opacity="${Math.min(1, tl * 2).toFixed(2)}">19 DAYS LATER</text>`;
    let s = `<g transform="${cam(540, 1100, 1.35)}">` + B.bunkroom(t) + B.radioTable(t);
    s += who({ who: 'hal', x: 240, y: 1500, expr: 'stern', armR: 1.0, bendR: 0.5, look: { x: 1, y: 0.4 } }, t);
    s += who({ who: 'priya', x: 860, y: 1500, expr: 'scared', flip: true, look: { x: -1, y: 0.4 } }, t);
    s += B.dark(0.8 + flick(t), [{ x: 540, y: 1180, r: 420 }]);
    return s + `</g>`;
  },
  black_knock(t, k, tl) {
    const kn = [0.0, 0.32, 0.64].some((a) => between(tl, a, a + 0.12)) ? 1 : 0;
    let s = `<rect x="-200" y="-200" width="1480" height="2320" fill="#000"/>`;
    if (kn) s += `<g opacity="0.35">` + B.concrete(-200, 1300) + B.door(t, { knock: 1 }) + `</g>`;
    return s;
  },
  title_pan(t, k, tl) {
    const cx = lerp(240, 1760, ease(k * 1.05));
    const xs = { milo: 240, june: 560, hal: 880, priya: 1200, teddy: 1500, dante: 1800 };
    let s = `<g transform="${cam(cx, 1010, 1.0)}">` + B.bunkroom(t);
    s += who({ who: 'milo', x: xs.milo, y: 1500, expr: 'scared', prop: 'camcorder', armR: 1.05, bendR: 0.7, look: { x: 1, y: 0 } }, t);
    s += who({ who: 'june', x: xs.june, y: 1500, expr: 'stern', prop: 'logbook', armR: 0.9, bendR: 0.8 }, t);
    s += who({ who: 'hal', x: xs.hal, y: 1500, expr: 'neutral', prop: 'flashlight', armR: 0.4, bendR: 0.3 }, t);
    s += who({ who: 'priya', x: xs.priya, y: 1500, expr: 'scared', armL: 0.5, bendL: 0.8 }, t);
    s += who({ who: 'teddy', x: xs.teddy, y: 1500, scale: 0.75, expr: 'blank', prop: 'rabbit', armR: 0.7, bendR: 0.9, look: { x: -1, y: 0 } }, t);
    s += who({ who: 'dante', x: xs.dante, y: 1500, expr: 'angry', armL: 0.35, armR: 0.35 }, t);
    s += B.fog(t, 1380, 9, 2400);
    s += B.dark(0.72 + flick(t), [{ x: 300, y: 600, r: 520 }, { x: 1020, y: 600, r: 520 }, { x: 1740, y: 600, r: 520 }]);
    for (const [n, x] of Object.entries(xs)) {
      const near = Math.abs(cx - x) < 330, a = near ? 1 : 0;
      if (a) s += `<text x="${x}" y="760" text-anchor="middle" font-family="SpecialElite" font-size="54" fill="#E4E1DA" opacity="0.95">${n.toUpperCase()}</text>`;
    }
    s += `</g>`;
    return s;
  },
  run_door(t, k, tl) {
    const mx = lerp(120, 470, ease(k * 1.2));
    let s = `<g transform="${cam(lerp(380, 560, ease(k)), 1000, 1.0)}">` + B.concrete(-400, 1600) + B.rule(t, 0.25) + B.door(t, {});
    s += who({ who: 'milo', x: mx, y: 1500, expr: 'hope', walk: k < 0.8 ? tl * 2.4 : null, prop: 'camcorder', armR: 0.6, bendR: 0.5, lean: k < 0.8 ? 6 : 0 }, t);
    s += B.fog(t, 1360, 6, 1600);
    s += B.dark(0.6 + flick(t), [{ x: 620, y: 1060, r: 360 }, { x: mx, y: 900, r: 380 }], [], '#1A0303');
    return s + `</g>`;
  },
  rule(t, k, tl) {
    const a = lerp(-1.75, -1.12, ease(tl / 0.9));
    const hx = 230, hy = 1500;
    const lx = hx + 50 + Math.sin(2.0) * 240, ly = hy - 540 + Math.cos(2.0) * 240;
    let s = `<g transform="${cam(520, 960, 1.0)}">` + B.concrete(-400, 1600) + B.rule(t, 1) + B.door(t, {});
    s += who({ who: 'hal', x: hx, y: hy, expr: 'stern', prop: 'flashlight', propRot: a * 57, armR: 2.0, bendR: 0.1, look: { x: 1, y: -1 } }, t);
    s += who({ who: 'milo', x: 860, y: 1500, expr: 'scared', prop: 'camcorder', armR: 1.0, bendR: 0.6, look: { x: -1, y: -1 }, flip: true }, t);
    s += B.dark(0.88, [{ x: 620, y: 1066, r: 160 }], [{ x: lx, y: ly, a, len: 1300, spread: 0.22 }]);
    return s + `</g>`;
  },
  rule_read(t, k, tl) {
    let s = `<g transform="${cam(620, 480, lerp(2.0, 2.25, k))}">` + B.concrete(-400, 1600) + B.rule(t, 1) + B.door(t, {});
    s += B.dark(0.9, [{ x: 620 + Math.sin(t * 2) * 30, y: 480, r: 520 }]);
    return s + `</g>`;
  },
  june(t, k, tl) {
    let s = `<g transform="${cam(540, lerp(1060, 1020, k), lerp(1.55, 1.7, k))}">` + B.bunkroom(t);
    s += who({ who: 'june', x: 540, y: 1500, expr: 'stern', prop: 'logbook', armR: 1.15, bendR: 0.9, look: { x: 0.6, y: 0 } }, t);
    s += B.dark(0.78 + flick(t), [{ x: 600, y: 1000, r: 420 }]);
    return s + `</g>`;
  },
  bolt(t, k, tl) {
    const bk = 0.5 * ease((tl - 0.6) / 0.5);
    let s = `<g transform="${cam(640, 1040, 1.12)}">` + B.concrete(-400, 1600) + B.rule(t, 0.35) + B.door(t, { boltK: bk });
    s += who({ who: 'milo', x: 300, y: 1500, expr: 'hope', prop: 'camcorder', armR: 1.0, bendR: 0.6 }, t);
    s += who({ who: 'dante', x: 930, y: 1500, expr: 'angry', armL: lerp(1.4, 1.62, ease((tl - 0.6) / 0.5)), bendL: -0.2, flip: false, look: { x: -1, y: 0 } }, t);
    s += B.dark(0.62 + flick(t), [{ x: 640, y: 1100, r: 520 }]);
    return s + `</g>`;
  },
  door_close(t, k, tl) {
    let s = `<g transform="${cam(620, 1070, lerp(2.6, 3.1, k))}">` + B.concrete(-400, 1600) + B.door(t, { boltK: 0.5 });
    for (let i = 0; i < 4; i++) {
      const ph = (tl * 0.5 + i / 4) % 1;
      s += `<ellipse cx="${(600 + i * 12).toFixed(0)}" cy="${(1070 - ph * 90).toFixed(1)}" rx="${(30 + ph * 60).toFixed(1)}" ry="${(12 + ph * 20).toFixed(1)}" fill="#C9D3DC" opacity="${(0.35 * (1 - ph)).toFixed(2)}" filter="url(#fogblur)"/>`;
    }
    s += B.dark(0.55 + flick(t, 0.12), [{ x: 620, y: 1066, r: 300 }], [], '#000');
    return s + `</g>`;
  },
  milo_cry(t, k, tl) {
    let s = `<g transform="${cam(470, 870, lerp(2.3, 2.6, k))}">` + B.concrete(-400, 1600) + B.door(t, { boltK: 0.5 });
    s += who({ who: 'milo', x: 470, y: 1500, expr: 'sad', prop: 'camcorder', armR: 1.0, bendR: 0.6, look: { x: 1, y: 0 }, headTilt: -4 }, t);
    s += B.dark(0.62, [{ x: 470, y: 860, r: 330 }], [], '#060812');
    return s + `</g>`;
  },
  priya(t, k, tl) {
    let s = `<g transform="${cam(560, 1000, 1.45)}">` + B.concrete(-400, 1600) + B.door(t, { boltK: 0.5 });
    s += who({ who: 'priya', x: 330, y: 1500, expr: 'scared', armR: 1.35, bendR: -0.2, look: { x: 1, y: 0 } }, t);
    s += who({ who: 'milo', x: 760, y: 1500, expr: 'sad', prop: 'camcorder', armR: 0.8, bendR: 0.5, flip: true, look: { x: 1, y: 0 } }, t);
    s += B.dark(0.66 + flick(t), [{ x: 540, y: 980, r: 520 }]);
    return s + `</g>`;
  },
  teddy(t, k, tl) {
    let s = `<g transform="${cam(1500, 1120, lerp(1.9, 2.4, ease(k)))}">` + B.bunkroom(t);
    s += who({ who: 'teddy', x: 1500, y: 1500, scale: 0.75, expr: 'blank', prop: 'rabbit', armR: 0.7, bendR: 0.9, look: { x: 0, y: 0 }, glow: true }, t);
    s += B.dark(0.95, [{ x: 1500, y: 1020, r: 120 }]);
    return s + `</g>`;
  },
  hand(t, k, tl) {
    const dur = sceneAt(t).t1 - sceneAt(t).t0;
    const hk = ease((tl - 0.6) / Math.max(0.5, dur - 1.6));
    const flash = tl > dur - 0.55;
    let s = `<g transform="${cam(630, 1180, lerp(2.0, 2.6, ease(k)))}">` + B.concrete(-400, 1600) + B.door(t, { boltK: 0.5, slotK: Math.min(1, tl / 0.5) }) + B.hand(t, hk);
    s += B.dark(0.6 + flick(t, 0.25), [{ x: 640, y: 1200, r: 360 }], [], '#000');
    s += `</g>`;
    if (flash) s += `<rect x="0" y="0" width="1080" height="1920" fill="${(tl * 20) % 2 < 1 ? '#FFFFFF' : '#7A0000'}"/>`;
    return s;
  },
  vote(t, k, tl) {
    let s = `<rect width="1080" height="1920" fill="#070708"/>`;
    s += `<g opacity="0.25">` + B.concrete(-200, 1300) + B.door(t, { boltK: 0.5 }) + `</g>`;
    s += `<rect width="1080" height="1920" fill="rgba(60,0,0,0.35)"/>`;
    const t0 = sceneAt(t).t0;
    const tk = pop(t, t0 + 0.1, 0.3);
    if (tk) s += `<g transform="translate(540 420) scale(${tk.toFixed(3)})"><text x="0" y="0" text-anchor="middle" font-family="SpecialElite" font-size="76" fill="#D2443A">WHAT DO THEY DO?</text></g>`;
    const opts = [['A', 'GRAB THE HAND'], ['B', 'SLAM THE SLOT SHUT'], ['C', 'ASK WHAT ONLY MAE KNOWS']];
    opts.forEach(([l, txt], i) => {
      const c = pop(t, t0 + 0.4 + i * 0.25, 0.22);
      if (!c) return;
      const y = 640 + i * 230;
      s += `<g transform="translate(540 ${y}) scale(${c.toFixed(3)})"><rect x="-470" y="-90" width="940" height="180" rx="10" fill="#141518" stroke="#D2443A" stroke-width="5"/>` +
        `<text x="-410" y="34" font-family="Anton" font-size="104" fill="#D2443A">${l}</text>` +
        `<text x="-320" y="26" font-family="Anton" font-size="${txt.length > 18 ? 58 : 66}" fill="#EDEAE3">${txt}</text></g>`;
    });
    if (tl > 1.4) s += `<text x="540" y="1420" text-anchor="middle" font-family="Anton" font-size="78" fill="#FFFFFF" opacity="${(0.75 + 0.25 * Math.sin(t * 6)).toFixed(2)}">COMMENT A, B OR C 👇</text>`;
    if (tl > 2.2) s += `<text x="540" y="1520" text-anchor="middle" font-family="SpecialElite" font-size="48" fill="#9A958C">NIGHT 20 · TOMORROW</text>`;
    return s;
  },
};

window.frame = function (t) {
  const sc = sceneAt(t), tl = t - sc.t0, k = Math.min(1, tl / Math.max(0.01, sc.t1 - sc.t0));
  document.getElementById('turb').setAttribute('seed', String(Math.floor(t * 24) % 97));
  document.getElementById('world').innerHTML = SCENES[sc.line.scene](t, k, tl);
  let ui = '';
  const scn = sc.line.scene;
  const stamp = { street_run: 'DAY 0 · 6:42 PM', garage_rush: 'DAY 0 · 6:49 PM', separation: 'DAY 0 · 6:52 PM', door_slam: 'DAY 0 · 6:52 PM', black_knock: 'NIGHT 19 · 3:04 AM' }[scn];
  if (stamp) ui += `<text x="540" y="230" text-anchor="middle" font-family="SpecialElite" font-size="46" fill="#C9C1B0">${stamp}</text>`;
  if (scn === 'title_pan' && k > 0.82) {
    const g = pop(t, sc.t0 + (sc.t1 - sc.t0) * 0.82, 0.25);
    ui += `<rect width="1080" height="1920" fill="rgba(0,0,0,${(0.55 * g).toFixed(2)})"/>` +
      `<g transform="translate(540 900) scale(${g.toFixed(3)})"><text x="0" y="0" text-anchor="middle" font-family="SpecialElite" font-size="112" fill="#D2443A">DON'T LET</text>` +
      `<text x="0" y="120" text-anchor="middle" font-family="SpecialElite" font-size="112" fill="#D2443A">THEM IN</text></g>`;
  }
  const cap = EP.caps.filter((c) => between(t, c.t0, c.t1)).slice(-1)[0];
  if (cap && scn !== 'vote') {
    const g = pop(t, cap.t0, 0.12), col = CAPCOL[cap.who] || '#fff';
    const name = (scn === 'separation' && cap.who === 'MAE') ? 'MAE' : ({ MAE: '??? (OUTSIDE)', NARR: '', RADIO: 'EMERGENCY BROADCAST' }[cap.who] ?? cap.who);
    ui += `<g transform="translate(540 1560) scale(${g.toFixed(3)})">`;
    if (name) ui += `<text x="0" y="-108" text-anchor="middle" font-family="SpecialElite" font-size="38" fill="${col}" opacity="0.85">${name}</text>`;
    ui += `<text x="0" y="0" text-anchor="middle" font-family="Anton" font-size="${cap.text.length > 15 ? 92 : 112}" fill="${col}" stroke="#000" stroke-width="18" stroke-linejoin="round" paint-order="stroke">${cap.text}</text></g>`;
  }
  document.getElementById('ui').innerHTML = ui;
};
window.EP = window.EP || { lines: [{ scene: 'title_pan', t0: 0, t1: 4 }], caps: [], mouth: {}, fps: 30, dur: 4 };
</script>
</body></html>
